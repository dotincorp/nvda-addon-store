name: Manual release

# Cuts a numbered release from `main`, the project's only long-lived branch. The
# store's channel is still chosen by hand at submission time -- `releaseType`
# here sets GitHub's prerelease flag, decides whether the version is written back
# to pyproject.toml, and keeps the reserved 0.0.x per-commit band out of stable
# releases. See docs/releasing.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Add-on version (major.minor.patch, integers only)'
        required: true
      releaseType:
        description: 'Release type (dev and beta are marked prerelease; stable bumps the version)'
        required: true
        type: choice
        options:
          - dev
          - beta
          - stable
        default: beta

# Repositories created after February 2023 default the GITHUB_TOKEN to read-only.
# This workflow pushes a tag, publishes a release, and (for a stable) pushes the
# version-bump commit. Declared here rather than relying on the repository
# setting, which needs admin to change.
permissions:
  contents: write

jobs:
  buildAndUpload:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        # Full history and tags. The release notes below pick the previous
        # numbered release to diff against, which a shallow clone cannot see.
        fetch-depth: 0

    # Fails before anything is built, committed, tagged or published. Every
    # later step mutates something outside this run, so the checks belong here
    # rather than after the build.
    - name: Validate release type and version
      env:
        VERSION: ${{ inputs.version }}
        RELEASE_TYPE: ${{ inputs.releaseType }}
      run: |
        import os
        import re
        import sys

        version = os.environ["VERSION"]
        releaseType = os.environ["RELEASE_TYPE"]
        errors = []

        # NVDA parses an add-on version as 2-3 dot-separated integers and
        # nothing else; anything it cannot parse cannot be compared against a
        # store entry. See addonStore/models/version.py.
        if not re.fullmatch(r"\d+\.\d+(\.\d+)?", version):
            errors.append(
                f"Version {version!r} is not 2-3 dot-separated integers. "
                "The add-on store has no pre-release syntax: use the .9x band "
                "for betas (e.g. 1.0.90 precedes 1.1.0)."
            )
        elif re.match(r"0\.0(\.|$)", version):
            # Every release type, not just stable: the automatic per-commit
            # builds already occupy this band, so a hand-cut dev or beta here
            # would clash with their numbers as well as sorting below releases.
            errors.append(
                f"Version {version!r} is in the 0.0.x band reserved for "
                "per-commit builds, which must stay below every release."
            )

        if errors:
            sys.exit("\n".join(f"error: {e}" for e in errors))
        print(f"{releaseType} release {version}: OK")
      shell: python

    # Only a stable release carries its version in the repo, so there is one
    # authoritative version line. Dev and beta cuts carry their version in the
    # tag and the release instead: writing them back would leave the branch
    # stamped with an already-published pre-release number, and would put a
    # commit on `main` for every test build.
    #
    # This step owns the bump, so the release prep commit does not have to: the
    # what's-new text names the release it describes and the test only rejects a
    # header older than pyproject.toml, so the prose can be approved before the
    # version moves. Written idempotently anyway -- the push step below commits
    # only if something actually changed -- so a re-dispatch is harmless.
    #
    # The build does not depend on this either way -- `version:` is passed to
    # the build action below, and scons' `version=` overrides what buildVars.py
    # read out of pyproject.toml.
    - name: Set add-on version
      if: inputs.releaseType == 'stable'
      env:
        VERSION: ${{ inputs.version }}
      run: |
        import os
        import pathlib
        import re
        import sys

        version = os.environ["VERSION"]
        path = pathlib.Path("pyproject.toml")
        text = path.read_text(encoding="utf-8")
        # Anchor to the `version` key of the [project] table: it is the first
        # table in the file, so the first top-of-line `version = "..."` is ours.
        # count=1 keeps dependency pins elsewhere in the file untouched.
        text, replaced = re.subn(
            r'(?m)^version = ".*"$', f'version = "{version}"', text, count=1
        )
        if replaced != 1:
            sys.exit("Could not find the [project] version key in pyproject.toml")
        path.write_text(text, encoding="utf-8")

        # uv.lock records the root project's own version, and the build action
        # runs `uv sync --locked`, which refuses to proceed against a lockfile
        # that no longer matches pyproject.toml. Leaving the lock behind would
        # fail the build before a single file was packaged.
        lockPath = pathlib.Path("uv.lock")
        lockText = lockPath.read_text(encoding="utf-8")
        lockText, replaced = re.subn(
            r'(?m)^(name = "dotpad"\nversion = )".*"$',
            lambda m: f'{m.group(1)}"{version}"',
            lockText,
            count=1,
        )
        if replaced != 1:
            sys.exit("Could not find the dotpad package version in uv.lock")
        lockPath.write_text(lockText, encoding="utf-8")
      shell: python

    - name: Build add-on
      uses: ./.github/actions/build-addon
      with:
        version: ${{ inputs.version }}

    # Stable only, matching the step above. Pushes to the dispatched ref rather
    # than a hardcoded branch name, so this stays correct if the branch is ever
    # renamed.
    - name: Push changes
      if: inputs.releaseType == 'stable'
      run: |
        git config --global user.name github-actions
        git config --global user.email github-actions@github.com
        # `git commit` exits non-zero on an empty diff, which happens whenever
        # the version is already what was dispatched -- a re-dispatch, say. A
        # failure here would abort the run after the add-on was built but before
        # it was tagged or published. Commit only if the step above changed
        # something.
        git diff --quiet || git commit -a -m "Release ${{ inputs.version }}"
        git push origin HEAD:${{ github.ref_name }}

    - name: Calculate sha256
      run: sha256sum *.nvda-addon >> sha256.txt

    # Runs before the tag is created, so `git tag --list` still describes the
    # state before this release.
    - name: Compose release notes
      id: notes
      env:
        VERSION: ${{ inputs.version }}
        RELEASE_TYPE: ${{ inputs.releaseType }}
        REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      run: |
        import os
        import pathlib
        import re
        import subprocess
        import sys

        version = os.environ["VERSION"]
        releaseType = os.environ["RELEASE_TYPE"]
        repoUrl = os.environ["REPO_URL"]

        # Only numbered releases are candidates. The automatic per-commit
        # workflow also maintains a `latest` tag, and GitHub would otherwise
        # pick it as the baseline for its generated notes -- diffing this
        # release against a moving pointer.
        numberedTag = re.compile(r"^\d+\.\d+(\.\d+)?$")

        def versionKey(tag):
            parts = tuple(int(p) for p in tag.split("."))
            return parts + (0,) * (3 - len(parts))

        tags = subprocess.run(
            ["git", "tag", "--list"], capture_output=True, text=True, check=True
        ).stdout.split()
        earlier = sorted(
            (t for t in tags if numberedTag.match(t) and versionKey(t) < versionKey(version)),
            key=versionKey,
        )
        previousTag = earlier[-1] if earlier else ""

        sections = []
        if previousTag:
            sections.append(
                f"**Full diff since {previousTag}:** "
                f"{repoUrl}/compare/{previousTag}...{version}"
            )
        else:
            print("warning: no earlier numbered tag; omitting compare link", file=sys.stderr)

        # Dev and beta builds never get a CHANGELOG.md section of their own --
        # entries stay under [Unreleased] until a stable ships -- so testers
        # would otherwise have no curated description of what they are running.
        # Collapsed, because it covers everything since the last stable and
        # would bury the build-to-build delta GitHub appends below.
        if releaseType != "stable":
            text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
            match = re.search(r"(?ms)^## \[Unreleased\]\s*\n(.*?)(?=^## \[|\Z)", text)
            body = match.group(1).strip() if match else ""
            if body:
                summary = "All changes since the last stable release"
                sections.append(
                    f"<details>\n<summary>{summary}</summary>\n\n{body}\n</details>"
                )
            else:
                print("warning: no [Unreleased] content in CHANGELOG.md", file=sys.stderr)

        notes = ("\n\n".join(sections) + "\n") if sections else ""
        pathlib.Path("releaseNotes.md").write_text(notes, encoding="utf-8")
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
            f.write(f"previousTag={previousTag}\n")
        print(f"previous tag: {previousTag or '(none)'}; {len(sections)} body section(s)")
      shell: python

    - name: Create tag
      run: |
        git tag ${{ inputs.version }}
        git push origin ${{ inputs.version }}

    - name: Release
      uses: ncipollo/release-action@v1
      with:
        tag: ${{ inputs.version }}
        # No signing step exists, so *.sig and publicKey.asc never matched.
        artifacts: "*.nvda-addon,sha256.txt"
        # bodyFile is prepended to the generated notes rather than replaced by
        # them (Action.ts: `${body}\n${releaseNotes}`), so the compare link and
        # the collapsed changelog sit above GitHub's list of merged PRs.
        bodyFile: releaseNotes.md
        generateReleaseNotes: true
        # Without this GitHub picks the most recent tag, which is usually
        # `latest` from the per-commit workflow.
        generateReleaseNotesPreviousTag: ${{ steps.notes.outputs.previousTag }}
        prerelease: ${{ inputs.releaseType != 'stable' }}
