[project]
name = "dotPad"
description = "Output braile text and graphics to Dot Pad braille displays."
version = "0.9.0"
maintainers = [
    {name = "Bram Duvigneau", email = "bram@bramd.nl"},
    {name = "Dot Incorporated", email = "info@dotincorp.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v2",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Accessibility",
]
readme = "readme.md"
license = {file = "COPYING.txt"}
requires-python = ">=3.13,<3.14"

[tool.ruff]
line-length = 110

builtins = [
	# translation lookup
	"_",
	# translation lookup
	"ngettext",
	# translation lookup
	"pgettext",
	# translation lookup
	"npgettext",
]

include = [
	"*.py",
	"*.pyw",
	"sconstruct",
	"*sconscript",
]

exclude = [
	".git",
	"__pycache__",
	# When excluding concrete paths relative to a directory,
	# not matching multiple folders by name e.g. `__pycache__`,
	# paths are relative to the configuration file.
	"./addon/_vendor",
	# Verbatim backport of NVDA's private _asyncioEventLoop module. Excluded from both
	# ruff and pyright so it stays byte-identical to NVDA's copy and can be re-synced or
	# dropped wholesale; formatting it would silently break that.
	"./addon/compat/asyncioEventLoop",
]

[tool.ruff.format]
indent-style = "tab"
line-ending = "lf"

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint]
ignore = [
	# indentation contains tabs
	"W191",
]
logger-objects = ["logHandler.log"]

[tool.ruff.lint.per-file-ignores]
# sconscripts contains many inbuilt functions not recognised by the lint,
# so ignore F821.
"sconstruct" = ["F821"]
"*sconscript" = ["F821"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"winsound.PlaySound".msg= "PlaySound uses winmm, which is deprecated in favor of the Windows core audio APIs."

# PEP 735 dependency groups, following the layout of nvaccess/AddonTemplate.
# Tooling is exact-pinned so that CI, git hooks and local runs all agree;
# dependabot bumps the pins.
[dependency-groups]
# Build the add-on
build = [
    "markdown==3.10",
    "scons==4.10.1",
]
# Translation management, used by the Crowdin sync workflow's scripts.
l10n = [
    "crowdin-api-client==1.24.1",
    # The template pins 6.1.0, but NVDA itself pins lxml==6.0.2 and both land in
    # the `dev` group, so match NVDA to keep the resolution satisfiable.
    "lxml==6.0.2",
    "markdown-link-attr-modifier==0.2.1",
    "mdx-gh-links==0.4",
    "mdx_truly_sane_lists==1.3",
    "nh3==0.3.2",
]
# Lint and type-check
lint = [
    "prek==0.4.8",
    "pyright[nodejs]==1.1.408",
    "ruff==0.16.5",
]
# NVDA source and its dependencies, needed to import NVDA modules when
# type-checking and when running the unit tests.
nvda = [
    "nvda-misc-deps",
    "nvda",
]
dev = [
    { include-group = "build" },
    { include-group = "l10n" },
    { include-group = "lint" },
    { include-group = "nvda" },
]
# Wheels vendored into addon/_vendor by build_vendor.py. Not installed by `uv sync`.
vendor = [
    "bleak==3.0.2",
]

[tool.pyright]
venvPath = ".venv"
venv = "."
pythonPlatform = "Windows"
typeCheckingMode = "strict"

include = [
	"**/*.py",
	"**/*.pyw",
]

exclude = [
	"sconstruct",
	"*sconscript",
	".git",
	"__pycache__",
	".tox",
	".venv",
	# When excluding concrete paths relative to a directory,
	# not matching multiple folders by name e.g. `__pycache__`,
	# paths are relative to the configuration file.
	"./addon/_vendor/*",
	# Verbatim backport of NVDA's private _asyncioEventLoop module. Kept byte-for-byte
	# so it can be re-synced or dropped wholesale; annotating it to this project's
	# strict standard would defeat that. Callers type against the _LoopUtils Protocol
	# in addon/ble/asyncUtils.py instead.
	"./addon/compat/asyncioEventLoop/*",
	# Translation-sync scripts taken verbatim from nvaccess/AddonTemplate, which
	# excludes them for the same reason: the crowdin-api-client package ships no
	# type information, so strict mode reports every response as partially
	# unknown. Kept excluded so the scripts stay a clean copy of upstream.
	"./.github/scripts",
	"./site_scons",
	"./tests",
]

# Tell pyright where to load python code from
extraPaths = [
	"../nvda/source",
	# Used internally in NVDA
	"../nvda/miscDeps/python",
	# Vendored dependencies
	"./addon/_vendor/cp313_win_amd64",
]

# General config
analyzeUnannotatedFunctions = true
deprecateTypingAliases = true

# Stricter typing
strictParameterNoneValue = true
strictListInference = true
strictDictionaryInference = true
strictSetInference = true

# Compliant rules
reportAssertAlwaysTrue = true
reportAssertTypeFailure = true
reportDuplicateImport = true
reportIncompleteStub = true
reportInconsistentOverload = true
reportInconsistentConstructor = true
reportInvalidStringEscapeSequence = true
reportInvalidStubStatement = true
reportInvalidTypeVarUse = true
reportMatchNotExhaustive = true
reportMissingModuleSource = true
reportMissingImports = true
reportNoOverloadImplementation = true
reportOptionalContextManager = true
reportOverlappingOverload = true
reportPrivateImportUsage = true
reportPropertyTypeMismatch = true
reportSelfClsParameterName = true
reportShadowedImports = true
reportTypeCommentUsage = true
reportTypedDictNotRequiredAccess = true
reportUndefinedVariable = true
reportUnusedExpression = true
reportUnboundVariable = true
reportUnhashable = true
reportUnnecessaryCast = true
reportUnnecessaryContains = true
# Disabled: NVDA's master vs released branches resolve some imported types
# (e.g. autoSettingsUtils.SupportedSettingType) differently. A `# type: ignore`
# that pyright deems unnecessary against a developer's local NVDA checkout may
# still be required against the released NVDA the CI matrix uses. Punishing
# the safer-direction redundancy is worse than tolerating it.
reportUnnecessaryTypeIgnoreComment = false
reportUntypedClassDecorator = true
reportUntypedFunctionDecorator = true
reportUnusedClass = true
reportUnusedCoroutine = true
reportUnusedExcept = true

# Should switch to true when possible
reportDeprecated = false  # 1834 errors

# Can be enabled by generating type stubs for modules via pyright CLI
reportMissingTypeStubs = false

# Bad rules
# Based on the list in NVDA's pyproject.toml,
# but only disabled if unfixable in the addon codebase
reportUnknownArgumentType = false
reportUnknownMemberType = false

[tool.uv.sources]
nvda = { git = "https://github.com/nvaccess/nvda.git" }
nvda-misc-deps = { git = "https://github.com/nvaccess/nvda-misc-deps.git" }
